<div class="explore">
  <div class="toolbar">
    <app-mode-toggle
      [mode]="store.mode()"
      (modeChange)="onModeChange($event)"
    />
    @if (store.isListView()) {
      <app-sort-controls
        [fields]="store.availableSortFields()"
        [orderBy]="store.orderBy()"
        [direction]="store.direction()"
        [limits]="limitOptions"
        [limit]="store.limit()"
        (orderByChange)="store.setOrderBy($event)"
        (directionChange)="store.setDirection($event)"
        (limitChange)="store.setLimit($event)"
      />
      <div class="toolbar-actions">
        <label class="live-toggle" title="Append new results as they are ingested">
          <input type="checkbox" [checked]="store.liveEnabled()" (change)="onLiveToggle($event)" />
          Live updates
        </label>
        <button class="refresh-btn" (click)="store.applyFilter()" aria-label="Refresh">
          <svg
            class="refresh-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
          Refresh
        </button>
      </div>
    }
  </div>

  @if (store.isListView()) {
    <app-filter-panel
      [filterMode]="store.filterMode()"
      [rawCondition]="store.rawCondition()"
      [rows]="store.builderRows()"
      [fields]="store.builderFields()"
      [compiled]="store.compiledCondition()"
      (filterModeChange)="store.setFilterMode($event)"
      (rawConditionChange)="store.setRawCondition($event)"
      (rowsChange)="store.setBuilderRows($event)"
      (apply)="store.applyFilter()"
    />

    <app-stream-status-bar
      [status]="store.status()"
      [error]="store.streamError()"
      [rowCount]="store.rowCount()"
      (cancel)="store.cancel()"
    />

    @if (store.status() === 'streaming' && store.rowCount() === 0) {
      <app-state-message variant="loading" message="Loading results…" />
    } @else if (store.status() === 'done' && store.rowCount() === 0) {
      <app-state-message
        variant="empty"
        [message]="store.hasFilter() ? 'No results — try adjusting your filter.' : 'No results.'"
      />
    } @else {
      <app-results-list
        [mode]="store.mode()"
        [traceRows]="store.traceRows()"
        [spanRows]="store.spanRows()"
        (rowClick)="onRowClick($event)"
      />
    }
  } @else {
    @defer (on immediate) {
      <app-stats-view />
    } @loading {
      <app-state-message variant="loading" />
    } @error {
      <app-state-message variant="error" [message]="statsLoadError" />
    }
  }
</div>
